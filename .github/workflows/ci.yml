name: Build & Verify Data Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # НОВЫЙ ШАГ: Проверка наличия тестовых данных
    - name: Verify Test Fixtures Existence
      run: |
        Write-Host "Checking for required database fixtures..."
        $requiredFiles = @(
          "database/fixtures/test_uniform_motion.sqlite",
          "database/fixtures/test_jump_deformation.sqlite",
          "database/fixtures/test_cyclic_movement.sqlite",
          "database/fixtures/test_rest_state.sqlite"
        )
        
        foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
                Write-Error "Missing critical test fixture: $file"
                exit 1
            } else {
                Write-Host "Found: $file"
            }
        }
        Write-Host "All test fixtures verified successfully."

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore curseuch.sln

    - name: Build Solution
      run: msbuild curseuch.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Curseuch-App-Release
        path: curseuch/bin/Release/*.exe
        retention-days: 7
        
    - name: Upload Docs and Tests
      uses: actions/upload-artifact@v4
      with:
        name: Project-Docs-QA
        path: |
          docs/
          database/
          README.md
        retention-days: 30