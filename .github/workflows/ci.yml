name: Build & Verify Data Integrity

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ИСПРАВЛЕННЫЙ ШАГ ПРОВЕРКИ ФАЙЛОВ
    - name: Verify Test Fixtures Existence
      run: |
        Write-Host "Checking for required database fixtures..."
        
        # Проверяем наличие самой папки
        if (!(Test-Path "databases/fixtures")) {
            Write-Error "Directory 'databases/fixtures' not found!"
            exit 1
        }

        # Получаем список всех .sqlite файлов в этой папке
        $files = Get-ChildItem -Path "databases/fixtures" -Filter *.sqlite
        
        if ($files.Count -eq 0) {
             Write-Error "No .sqlite files found in databases/fixtures!"
             exit 1
        }

        Write-Host "Found $($files.Count) test fixture(s):"
        foreach ($file in $files) {
            Write-Host "- $($file.Name)"
        }
        
        # Дополнительно можно проверить конкретные важные файлы, если нужно жестко
        # Например, если бы они назывались именно так:
        # if (!(Test-Path "databases/fixtures/test_1_rest_state.sqlite")) { exit 1 } 

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore curseuch.sln

    - name: Build Solution
      run: msbuild curseuch.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Curseuch-App-Release
        path: curseuch/bin/Release/*.exe
        retention-days: 7
        
    - name: Upload Docs and Tests
      uses: actions/upload-artifact@v4
      with:
        name: Project-Docs-QA
        path: |
          docs/
          databases/
          README.md
        retention-days: 30